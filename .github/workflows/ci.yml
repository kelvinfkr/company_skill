name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/company-talent-economics/requirements.txt

      - name: Install LibreOffice and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-noto-cjk fonts-noto-core

      - name: Validate locale packs and the jurisdiction registry
        run: python skills/company-talent-economics/scripts/check_locales.py

      - name: Compile every script
        run: python -m compileall -q skills/company-talent-economics/scripts

      - name: Shellcheck the installer
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh

      - name: End-to-end harness selftest (gates 0-10, provisional path, every locale, PDF)
        run: python skills/company-talent-economics/scripts/selftest.py --pdf

      - name: Installer dependency check
        run: bash install.sh --check

      - name: Build the uploadable zip
        run: bash install.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: company-talent-economics-skill
          path: dist/company-talent-economics.zip
